name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags '-s -w' -o bin/talea${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/talea
      - name: Archive
        run: |
          cd bin
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ../talea-${{ matrix.goos }}-${{ matrix.goarch }}.zip talea.exe
          else
            tar -czf ../talea-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz talea
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: talea-${{ matrix.goos }}-${{ matrix.goarch }}
          path: talea-${{ matrix.goos }}-${{ matrix.goarch }}.*
